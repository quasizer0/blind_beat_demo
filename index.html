<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Blind Beat Demo</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700;900&family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
<style>

:root{
  --bg:#02050a;
  --bg-2:#071018;
  --bg-3:#0a151d;
  --panel:rgba(10,16,24,.54);
  --panel-strong:rgba(12,18,26,.72);
  --text:#eef6fb;
  --text-soft:rgba(221,235,245,.74);
  --text-dim:rgba(164,184,198,.58);
  --muted:rgba(164,184,198,.58);
  --line:rgba(140,205,225,.16);
  --line-strong:rgba(166,231,255,.34);
  --accent:#86dfff;
  --accent-2:#65ffbf;
  --danger:#ff8b6a;
  --danger-2:#d7ff55;
  --memory:#b5b8ff;
  --core:#f4fcff;
  --radius:22px;
  --radius-sm:14px;
  --card-width:min(82vw, 356px);
  --safe-top:max(24px, env(safe-area-inset-top));
  --safe-bottom:max(24px, env(safe-area-inset-bottom));
  --safe-left:max(24px, env(safe-area-inset-left));
  --safe-right:max(24px, env(safe-area-inset-right));
  --easing:cubic-bezier(.22,1,.36,1);
  --side-pad:calc(50vw - (var(--card-width) / 2));
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden}
body{
  margin:0;
  color:var(--text);
  font-family:'Outfit','Noto Sans TC',sans-serif;
  letter-spacing:.01em;
  background:
    linear-gradient(180deg,#03070b 0%, #03070b 18%, #02050a 100%);
  user-select:none;
}
body::before{
  content:"";
  position:fixed; inset:0; pointer-events:none; z-index:0;
  background:
    radial-gradient(48% 34% at 50% -6%, rgba(163,229,255,.13), rgba(76,140,160,.04) 38%, rgba(0,0,0,0) 72%),
    linear-gradient(180deg, rgba(118,190,215,.14) 0%, rgba(83,138,160,.05) 12%, rgba(0,0,0,0) 34%),
    radial-gradient(60% 18% at 50% 0%, rgba(255,255,255,.06), rgba(0,0,0,0) 58%);
  mask-image: linear-gradient(180deg, rgba(0,0,0,.95) 0%, rgba(0,0,0,.5) 42%, rgba(0,0,0,0) 74%);
}
body::after{
  content:"";
  position:fixed; inset:0; pointer-events:none; z-index:1; opacity:.34;
  background-image:
    radial-gradient(circle at 50% 8%, rgba(255,255,255,.13) 0 0.9px, transparent 1.2px),
    radial-gradient(circle at 44% 14%, rgba(255,255,255,.08) 0 0.7px, transparent 1px),
    radial-gradient(circle at 57% 18%, rgba(255,255,255,.06) 0 0.8px, transparent 1.1px),
    radial-gradient(circle at 38% 24%, rgba(255,255,255,.04) 0 0.9px, transparent 1.1px),
    radial-gradient(circle at 61% 11%, rgba(255,255,255,.07) 0 0.8px, transparent 1px),
    radial-gradient(circle at 52% 21%, rgba(255,255,255,.05) 0 0.8px, transparent 1.1px);
  animation: dustFloat 22s linear infinite;
}
@keyframes dustFloat{
  0%{transform:translateY(-8px)}
  50%{transform:translateY(10px)}
  100%{transform:translateY(-8px)}
}

.space-dust,.space-dust::before,.space-dust::after{content:""; position:fixed; inset:-8%; pointer-events:none; z-index:1;}
.space-dust{background-image:radial-gradient(circle at 14% 18%, rgba(255,255,255,.08) 0 1px, transparent 1.6px),radial-gradient(circle at 78% 26%, rgba(180,230,255,.06) 0 1px, transparent 1.6px),radial-gradient(circle at 56% 12%, rgba(255,255,255,.07) 0 .8px, transparent 1.4px),radial-gradient(circle at 42% 32%, rgba(170,220,255,.05) 0 1px, transparent 1.5px); opacity:.28; animation:dustDrift 26s linear infinite;}
.space-dust::before{background-image:radial-gradient(circle at 24% 42%, rgba(255,255,255,.05) 0 .9px, transparent 1.4px),radial-gradient(circle at 62% 48%, rgba(176,230,255,.05) 0 .9px, transparent 1.4px),radial-gradient(circle at 82% 34%, rgba(255,255,255,.04) 0 .8px, transparent 1.3px); opacity:.45; animation:dustDrift 34s linear infinite reverse;}
.space-dust::after{background:linear-gradient(180deg, rgba(255,255,255,.02), rgba(255,255,255,0) 45%); opacity:.35; mask-image:radial-gradient(44% 52% at 50% 0%, rgba(0,0,0,.95), rgba(0,0,0,0) 76%);}
@keyframes dustDrift{0%{transform:translate3d(0,-10px,0)}50%{transform:translate3d(8px,14px,0)}100%{transform:translate3d(-4px,-10px,0)}}

@media (pointer:fine){
  body.cursor-hidden,body.cursor-hidden button,body.cursor-hidden .btn,body.cursor-hidden .level-card,body.cursor-hidden .levels,body.cursor-hidden .tag,body.cursor-hidden .back-btn{cursor:none!important}
  #cursorPresence{position:fixed; inset:0; pointer-events:none; z-index:999; opacity:0; transition:opacity .16s ease}
  #cursorPresence.visible{opacity:1}
  #cursorPresence .cursor-ring,#cursorPresence .cursor-core,#cursorPresence .cursor-tail{position:absolute; left:0; top:0; transform:translate(-50%,-50%); will-change:transform}
  #cursorPresence .cursor-ring{width:22px; height:22px; border-radius:999px; border:1px solid rgba(180,236,255,.42); box-shadow:0 0 0 1px rgba(180,236,255,.05), 0 0 16px rgba(109,204,236,.10); background:radial-gradient(circle, rgba(160,228,255,.03), rgba(160,228,255,0) 72%); transition:width .16s var(--easing), height .16s var(--easing), border-color .16s var(--easing), box-shadow .16s var(--easing), opacity .16s ease}
  #cursorPresence .cursor-core{width:5px; height:5px; border-radius:999px; background:linear-gradient(180deg, #f3fbff, #9fe8ff); box-shadow:0 0 12px rgba(146,226,255,.28); transition:width .14s var(--easing), height .14s var(--easing), filter .14s var(--easing), opacity .14s ease}
  #cursorPresence .cursor-tail{width:42px; height:2px; border-radius:999px; background:linear-gradient(90deg, rgba(166,231,255,0), rgba(166,231,255,.55), rgba(166,231,255,0)); opacity:.0; transform-origin:left center; transition:opacity .14s ease, width .16s var(--easing)}
  #cursorPresence .cursor-ring::before,#cursorPresence .cursor-ring::after{content:""; position:absolute; left:50%; top:50%; width:10px; height:1px; background:rgba(194,240,255,.42); transform:translate(-50%,-50%); opacity:.72}
  #cursorPresence .cursor-ring::after{width:1px; height:10px}
  #cursorPresence[data-mode="button"] .cursor-ring::before,#cursorPresence[data-mode="button"] .cursor-ring::after{opacity:.9}
  #cursorPresence[data-mode="drag"] .cursor-ring::before{width:8px}
  #cursorPresence[data-mode="drag"] .cursor-ring::after{height:8px}
  #cursorPresence[data-mode="button"] .cursor-ring{width:28px; height:28px; border-color:rgba(176,232,255,.58); box-shadow:0 0 0 1px rgba(176,232,255,.08), 0 0 26px rgba(122,222,255,.16)}
  #cursorPresence[data-mode="card"] .cursor-ring{width:30px; height:30px; border-color:rgba(170,230,255,.54)}
  #cursorPresence[data-mode="tag"] .cursor-ring{width:24px; height:24px; border-color:rgba(170,230,255,.42)}
  #cursorPresence[data-mode="drag"] .cursor-ring{width:18px; height:18px; border-color:rgba(196,238,255,.68); box-shadow:0 0 0 1px rgba(176,232,255,.1), 0 0 24px rgba(136,232,255,.2)}
  #cursorPresence[data-mode="drag"] .cursor-core{width:7px; height:7px; filter:brightness(1.12)}
  #cursorPresence.hot .cursor-tail{opacity:.85; width:48px}
  #cursorPresence[data-mode="button"] .cursor-core{filter:brightness(1.22)}
  #cursorPresence[data-mode="card"] .cursor-tail{opacity:.75; width:42px}
  #cursorPresence[data-mode="tag"] .cursor-tail{opacity:.55; width:26px}
  #cursorPresence[data-mode="drag"] .cursor-tail{opacity:.92; width:56px}
}
body.cursor-ready #cursorPresence{opacity:1}
body.cursor-active #cursorPresence{opacity:1}
body.cursor-hidden #cursorPresence{opacity:1}
.level-card.hovered::before{opacity:.58}
.level-card.hovered{border-color:rgba(176,230,255,.26)}
.level-card.hovered::after{opacity:.85}
.tag.role-threat{clip-path:polygon(0 8px, 8px 0, calc(100% - 8px) 0, 100% 50%, calc(100% - 8px) 100%, 0 100%)}
.tag.role-threat::before{box-shadow:0 0 10px rgba(255,166,110,.18)}
.tag.role-threat::after{background:linear-gradient(90deg, transparent, rgba(255,196,158,.06), transparent)}
.tag.role-threat.hovered{box-shadow:inset 0 0 0 1px rgba(255,167,121,.38), 0 0 0 1px rgba(255,167,121,.1)}
.tag.role-threat.hovered::after{opacity:1; transform:translateX(0)}
.screen{
  position:absolute; inset:0; z-index:2;
  padding:var(--safe-top) var(--safe-right) var(--safe-bottom) var(--safe-left);
  opacity:0; pointer-events:none;
  transform:translateY(10px) scale(.99);
  transition:opacity .34s var(--easing), transform .38s var(--easing);
}
.screen.active{opacity:1; pointer-events:auto; transform:translateY(0) scale(1); z-index:5}
.center-stack{
  position:relative;
  width:min(100%,560px);
  min-height:calc(100vh - var(--safe-top) - var(--safe-bottom));
  margin:0 auto;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  gap:24px;
  text-align:center;
}
.brand{
  margin:0;
  font-size:clamp(58px,8vw,98px);
  font-weight:900;
  line-height:.92;
  letter-spacing:.08em;
  text-transform:uppercase;
  color:#f5fbff;
  text-shadow:0 0 18px rgba(150,222,255,.08), 0 0 32px rgba(150,222,255,.04);
}
.page-title,.result-title,.cal-title{
  margin:0;
  font-size:22px;
  line-height:1;
  font-weight:900;
  letter-spacing:.18em;
  text-transform:uppercase;
  color:rgba(233,244,250,.9);
}
.status-line,.tiny-line{
  font-size:13px;
  line-height:1.5;
  letter-spacing:.12em;
  text-transform:uppercase;
  color:var(--text-dim);
}
.progress-wrap{
  width:min(100%,400px);
  height:8px;
  border-radius:999px;
  overflow:hidden;
  background:rgba(255,255,255,.04);
  box-shadow:inset 0 0 0 1px rgba(157,221,242,.1);
}
.progress-bar{
  height:100%; width:0;
  border-radius:999px;
  background:linear-gradient(90deg, rgba(126,225,255,.92), rgba(95,255,191,.88));
  box-shadow:0 0 18px rgba(118,225,255,.16);
  transition:width .18s linear;
}

button,.btn{
  --px:50%;
  --py:50%;
  appearance:none; outline:none; border:0;
  cursor:pointer;
  width:100%;
  min-height:52px;
  padding:14px 22px;
  border-radius:16px;
  font:inherit;
  font-size:15px;
  font-weight:800;
  letter-spacing:.08em;
  text-transform:uppercase;
  color:#f0f8ff;
  position:relative;
  overflow:hidden;
  background:
    linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.02)),
    linear-gradient(180deg, rgba(12,18,25,.94), rgba(7,11,17,.96));
  box-shadow:
    0 18px 34px rgba(0,0,0,.34),
    inset 0 1px 0 rgba(255,255,255,.08),
    inset 0 0 0 1px rgba(154,216,236,.12);
  transition:transform .16s var(--easing), box-shadow .18s var(--easing), filter .18s var(--easing), opacity .18s var(--easing), border-color .18s var(--easing);
}
button::before,.btn::before{
  content:"";
  position:absolute; left:12px; right:12px; top:0;
  height:1px;
  background:linear-gradient(90deg, rgba(255,255,255,0), rgba(174,233,255,.35), rgba(255,255,255,0));
  opacity:.78;
  transition:opacity .14s var(--easing), filter .18s var(--easing);
}
button::after,.btn::after{
  content:"";
  position:absolute; inset:0;
  background:
    radial-gradient(160px circle at var(--px) var(--py), rgba(158,227,255,.16), rgba(158,227,255,.04) 24%, rgba(158,227,255,0) 62%);
  opacity:0;
  transition:opacity .2s var(--easing);
  pointer-events:none;
}
button:hover,.btn:hover{
  transform:translateY(-2px);
  box-shadow:
    0 22px 38px rgba(0,0,0,.38),
    0 8px 24px rgba(136,232,255,.08),
    inset 0 1px 0 rgba(255,255,255,.1),
    inset 0 0 0 1px rgba(166,231,255,.22);
}
button.hovered::before,.btn.hovered::before{opacity:1; filter:brightness(1.24)}
button.hovered::after,.btn.hovered::after{opacity:1; transition-delay:58ms}
button:active,.btn:active{
  transform:translateY(0) scale(.985);
  box-shadow:
    0 14px 22px rgba(0,0,0,.36),
    inset 0 2px 6px rgba(0,0,0,.26),
    inset 0 0 0 1px rgba(166,231,255,.24);
}
button.primary,.btn.primary{
  background:
    linear-gradient(180deg, rgba(144,226,255,.18), rgba(255,255,255,.03)),
    linear-gradient(180deg, rgba(14,24,33,.96), rgba(7,12,18,.98));
  box-shadow:
    0 22px 44px rgba(0,0,0,.42),
    0 0 0 1px rgba(134,223,255,.18),
    inset 0 1px 0 rgba(255,255,255,.12),
    inset 0 0 0 1px rgba(162,229,255,.22);
}
button.secondary,.btn.secondary{
  background:
    linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.015)),
    linear-gradient(180deg, rgba(11,16,23,.88), rgba(6,10,15,.94));
}
button.ghost,.btn.ghost{
  width:auto; min-width:112px;
  background:
    linear-gradient(180deg, rgba(255,255,255,.04), rgba(255,255,255,.01)),
    rgba(9,13,19,.56);
  box-shadow:
    0 12px 26px rgba(0,0,0,.25),
    inset 0 0 0 1px rgba(155,216,236,.12);
}
button[disabled],.btn[disabled]{opacity:.34; cursor:not-allowed; transform:none!important; filter:saturate(.72)}
.menu-buttons,.boot-buttons{
  display:flex; flex-direction:column; gap:16px; width:min(100%,360px);
}
.continue-line{
  min-height:18px;
  margin-top:-6px;
  font-size:11px;
  letter-spacing:.14em;
  text-transform:uppercase;
  color:var(--text-dim);
}
#menuScreen .center-stack{gap:28px}
#selectScreen{
  padding:0;
  height:100vh;
  overflow:hidden;
  display:flex;
  flex-direction:column;
  justify-content:center;
}
.select-shell{
  position:relative;
  flex:1;
  min-height:0;
  display:flex;
  flex-direction:column;
  padding:var(--safe-top) var(--safe-right) var(--safe-bottom) var(--safe-left);
}
.select-top{
  display:flex; align-items:center; justify-content:center;
  min-height:56px; flex:0 0 auto; position:relative;
}
.back-btn{
  position:absolute;
  left:var(--safe-left);
  top:var(--safe-top);
  z-index:12;
}
.select-stage{
  flex:1; min-height:0;
  display:flex; align-items:center; justify-content:center;
}
.select-viewport{
  width:100%;
  height:min(72vh,590px);
  display:flex; align-items:center; justify-content:center;
  position:relative;
}
.levels{
  display:flex; flex-wrap:nowrap; align-items:center; gap:26px;
  width:100%; height:100%;
  overflow-x:auto; overflow-y:hidden; scrollbar-width:none;
  padding:40px var(--side-pad);
  scroll-padding:0 var(--side-pad);
  scroll-snap-type:x mandatory;
  cursor:grab;
}
.levels.dragging{cursor:grabbing; scroll-snap-type:none}
.levels::-webkit-scrollbar{display:none}
.level-spacer{flex:0 0 1px; height:1px}
.level-card{
  --mx:50%;
  --my:28%;
  --scanX:50%;
  position:relative;
  flex:0 0 var(--card-width);
  width:var(--card-width);
  height:min(63vh,536px);
  display:flex; flex-direction:column; justify-content:space-between;
  padding:28px 28px 26px;
  scroll-snap-align:center;
  border-radius:28px;
  clip-path:polygon(0 14px, 14px 0, 100% 0, 100% calc(100% - 14px), calc(100% - 14px) 100%, 0 100%);
  background:
    radial-gradient(180px circle at var(--mx) var(--my), rgba(166,231,255,.09), rgba(166,231,255,.03) 22%, rgba(166,231,255,0) 58%),
    linear-gradient(180deg, rgba(255,255,255,.04), rgba(255,255,255,.012)),
    linear-gradient(180deg, rgba(10,15,22,.74), rgba(7,12,18,.88));
  border:1px solid rgba(154,216,236,.11);
  box-shadow:
    0 26px 52px rgba(0,0,0,.48),
    inset 0 1px 0 rgba(255,255,255,.06),
    inset 0 0 0 1px rgba(255,255,255,.02);
  overflow:hidden;
  opacity:.18;
  transform:translateY(14px) scale(.78);
  transition:transform .44s var(--easing), opacity .34s var(--easing), box-shadow .34s var(--easing), border-color .34s var(--easing), filter .34s var(--easing), background-position .16s linear;
  filter:saturate(.7) blur(.1px);
  cursor:pointer;
}
.level-card::before{
  content:"";
  position:absolute; left:18px; right:18px; top:0;
  height:58px;
  background:
    linear-gradient(180deg, rgba(176,230,255,.16), rgba(176,230,255,0)),
    linear-gradient(90deg,
      transparent 0,
      transparent calc(var(--scanX) - 18px),
      rgba(226,246,255,.18) calc(var(--scanX) - 3px),
      rgba(255,255,255,.32) var(--scanX),
      rgba(226,246,255,.12) calc(var(--scanX) + 5px),
      transparent calc(var(--scanX) + 18px),
      transparent 100%);
  opacity:.22;
  pointer-events:none;
  transition:opacity .18s var(--easing);
}
.level-card::after{
  content:"";
  position:absolute; left:18px; right:18px; bottom:-12px;
  height:60px;
  background:radial-gradient(60% 70% at 50% 0%, rgba(0,0,0,.42), rgba(0,0,0,0));
  pointer-events:none;
}
.level-card.hovered{
  border-color:rgba(176,230,255,.22);
}
.level-card.hovered::before{opacity:.48}
.level-card.is-near{
  opacity:.54;
  transform:translateY(6px) scale(.9);
  filter:saturate(.88);
}
.level-card.is-active{
  opacity:1;
  transform:translateY(0) scale(1);
  filter:none;
  border-color:rgba(176,230,255,.28);
  box-shadow:
    0 34px 72px rgba(0,0,0,.56),
    0 0 0 1px rgba(166,231,255,.18),
    0 0 26px rgba(107,204,236,.08),
    inset 0 1px 0 rgba(255,255,255,.08);
}
.level-card.trail{
  animation:cardTrail .26s var(--easing);
}
@keyframes cardTrail{
  0%{box-shadow:0 34px 72px rgba(0,0,0,.56),0 0 0 1px rgba(166,231,255,.18),0 0 8px rgba(107,204,236,.08), inset 0 1px 0 rgba(255,255,255,.08)}
  40%{box-shadow:0 36px 76px rgba(0,0,0,.58),0 0 0 1px rgba(166,231,255,.32),0 0 40px rgba(107,204,236,.18), inset 0 1px 0 rgba(255,255,255,.1)}
  100%{box-shadow:0 34px 72px rgba(0,0,0,.56),0 0 0 1px rgba(166,231,255,.18),0 0 26px rgba(107,204,236,.08), inset 0 1px 0 rgba(255,255,255,.08)}
}
.level-card.locked{opacity:.28; filter:grayscale(.18)}
.card-top{display:flex; flex-direction:column; gap:10px; position:relative; z-index:1}
.card-kicker{
  font-size:10px; font-weight:700; letter-spacing:.24em; text-transform:uppercase; color:rgba(160,182,196,.42);
}
.card-title{
  font-size:34px; font-weight:900; line-height:.92; letter-spacing:.02em; text-transform:none; color:#f5fbff; text-shadow:0 8px 28px rgba(0,0,0,.32);
}
.card-sub{
  font-size:14px; font-weight:700; letter-spacing:.18em; text-transform:uppercase; color:rgba(232,242,248,.76);
}
.card-bpm{
  font-size:13px; font-weight:900; letter-spacing:.16em; text-transform:uppercase; color:rgba(151,222,246,.92);
}
.card-body{display:flex; flex-direction:column; gap:16px; position:relative; z-index:1; margin-top:8px}
.tag-row{display:flex; flex-wrap:nowrap; gap:12px; min-height:40px; align-items:center}
.tag.slot-1{opacity:1}
.tag.slot-2{opacity:.92}
.tag.slot-3{opacity:1; margin-left:2px}
.tag{
  --px:50%;
  position:relative;
  display:inline-flex; align-items:center;
  min-height:30px;
  padding:7px 12px 7px 14px;
  clip-path:polygon(0 8px, 8px 0, 100% 0, 100% 100%, 0 100%);
  background:rgba(10,18,25,.56);
  box-shadow:inset 0 0 0 1px rgba(176,230,255,.12);
  font-size:11px;
  font-weight:800;
  letter-spacing:.04em;
  text-transform:none;
  color:#deeff8;
  white-space:nowrap;
  overflow:hidden;
  transition:box-shadow .16s var(--easing), transform .16s var(--easing), border-color .16s var(--easing), color .16s var(--easing);
}
.tag::before{
  content:"";
  width:3px; align-self:stretch; margin-right:10px; margin-left:-2px;
  border-radius:999px;
  background:var(--tag-accent, rgba(176,230,255,.28));
  transition:filter .16s var(--easing), transform .16s var(--easing), opacity .16s var(--easing);
}
.tag::after{
  content:"";
  position:absolute; inset:0;
  background:linear-gradient(90deg, transparent, rgba(255,255,255,.05), transparent);
  opacity:0;
  transform:translateX(-24%);
  transition:opacity .16s var(--easing), transform .18s var(--easing);
  pointer-events:none;
}
.tag.role-theme{
  --tag-accent: rgba(120,213,255,.72);
  color:#eaf8ff;
  box-shadow:inset 0 0 0 1px rgba(176,230,255,.18);
}
.tag.role-play{
  --tag-accent: rgba(101,255,191,.5);
  color:#dbe9f1;
  box-shadow:inset 0 0 0 1px rgba(176,230,255,.1);
}
.tag.role-threat{
  --tag-accent: rgba(255,158,112,.88);
  color:#fff0dd;
  box-shadow:inset 0 0 0 1px rgba(255,167,121,.22);
}

function renderPointer(){
  pointerState.px += (pointerState.x - pointerState.px) * 0.24;
  pointerState.py += (pointerState.y - pointerState.py) * 0.24;
  const dx = pointerState.x - pointerState.px;
  const dy = pointerState.y - pointerState.py;
  if(el.cursorRing){

    el.cursorCore.style.left = `${pointerState.x}px`;

function queuePointer(){ if(pointerState.enabled && !pointerState.raf) pointerState.raf = requestAnimationFrame(renderPointer); }
function enableCustomCursor(force=false){
  if(matchMedia('(pointer: coarse)').matches || !el.cursorPresence || !el.cursorRing || !el.cursorCore || !el.cursorTail){
    disableCustomCursor(true);
    return false;
  }
  pointerState.enabled = true;
  pointerState.degraded = false;
  document.body.classList.add('cursor-ready','cursor-active','cursor-enhanced');
  if(pointerState.seenMove) document.body.classList.add('cursor-hidden');
  el.cursorPresence.classList.add('visible');
  if(force){
    pointerState.x = pointerState.tx;
    pointerState.y = pointerState.ty;
  }
  queuePointer();
  return true;
}

function disableCustomCursor(fallbackToNative=false){
  pointerState.enabled = false;
  if(fallbackToNative) pointerState.degraded = true;
  document.body.classList.remove('cursor-active','cursor-hidden','cursor-enhanced');
  if(el.cursorPresence){
    el.cursorPresence.classList.remove('visible','hot');
    el.cursorPresence.dataset.mode = 'default';
  }
}
function reviveCustomCursor(){
  if(pointerState.degraded) return;
  if(!matchMedia('(pointer: coarse)').matches){
    enableCustomCursor(true);
  }
}
function setPointerMode(mode='default'){ if(el.cursorPresence && pointerState.enabled) el.cursorPresence.dataset.mode = mode; }
function setPointerHot(on){ if(el.cursorPresence && pointerState.enabled) el.cursorPresence.classList.toggle('hot', !!on); }
function setPointerPosition(x=window.innerWidth*0.5, y=window.innerHeight*0.5, force=false){
  pointerState.tx = x; pointerState.ty = y;
  if(force){
    pointerState.x = x; pointerState.y = y; pointerState.px = x; pointerState.py = y;
  } else {
    pointerState.x = x; pointerState.y = y;
  }
  if(el.cursorRing){
    el.cursorPresence.classList.add('visible');
    el.cursorRing.style.left = `${pointerState.x}px`;
    el.cursorRing.style.top = `${pointerState.y}px`;
    el.cursorCore.style.left = `${pointerState.x}px`;
    el.cursorCore.style.top = `${pointerState.y}px`;
    const angle = Math.atan2(pointerState.y - pointerState.py, pointerState.x - pointerState.px) * 180 / Math.PI;
    el.cursorTail.style.left = `${pointerState.px}px`;
    el.cursorTail.style.top = `${pointerState.py}px`;
    el.cursorTail.style.transform = `translate(-50%,-50%) rotate(${angle}deg)`;
  }
  reviveCustomCursor();
  queuePointer();
}
function initPointerPresence(){
  if(matchMedia('(pointer: coarse)').matches || !el.cursorPresence) return;
  setPointerPosition(window.innerWidth*0.5, window.innerHeight*0.5, true);
  enableCustomCursor(true);
  const syncPointer = (e)=>{ if(e && typeof e.clientX === 'number' && typeof e.clientY === 'number'){ pointerState.seenMove = true; if(pointerState.enabled) document.body.classList.add('cursor-hidden'); setPointerPosition(e.clientX, e.clientY, true); } };
  window.addEventListener('mousemove', syncPointer, {passive:true});
  window.addEventListener('pointermove', syncPointer, {passive:true});
  document.addEventListener('pointerdown', (e)=>{ syncPointer(e); setPointerHot(true); });
  document.addEventListener('pointerup', (e)=>{ syncPointer(e); setPointerHot(false); });
  window.addEventListener('mouseout', (e)=>{ if(!e.relatedTarget) disableCustomCursor(false); });
  window.addEventListener('mouseover', ()=>{ if(pointerState.seenMove) reviveCustomCursor(); });
  window.addEventListener('blur', ()=>disableCustomCursor(false));
  window.addEventListener('focus', ()=>{ if(pointerState.seenMove) reviveCustomCursor(); });
  window.addEventListener('resize', ()=> setPointerPosition(pointerState.tx, pointerState.ty, true));
  document.addEventListener('visibilitychange', ()=>{ if(document.hidden) disableCustomCursor(false); else if(pointerState.seenMove) reviveCustomCursor(); });
  document.addEventListener('fullscreenchange', ()=> setTimeout(()=>{ if(pointerState.seenMove) reviveCustomCursor(); }, 60));
}


function loadAudioSettings(){
  try{
    const raw = localStorage.getItem('blindbeat_audio_settings');
    if(!raw) return;
    const saved = JSON.parse(raw);
    if(saved && typeof saved==='object'){
      app.audioSettings.master = clamp(Number(saved.master) || 100, 0, 200);
      app.audioSettings.bgm = clamp(Number(saved.bgm) || 100, 0, 200);
      app.audioSettings.sfx = clamp(Number(saved.sfx) || 100, 0, 200);
    }
  }catch(e){}
}
function saveAudioSettings(){
  try{ localStorage.setItem('blindbeat_audio_settings', JSON.stringify(app.audioSettings)); }catch(e){}
}
function syncAudioPanelUI(){
  if(el.masterSlider) el.masterSlider.value = app.audioSettings.master;
  if(el.bgmSlider) el.bgmSlider.value = app.audioSettings.bgm;
  if(el.sfxSlider) el.sfxSlider.value = app.audioSettings.sfx;
  if(el.masterValue) el.masterValue.textContent = String(app.audioSettings.master);

  if(el.sfxValue) el.sfxValue.textContent = String(app.audioSettings.sfx);

function applyAudioSettings(){
  if(audio && audio.master) audio.master.gain.value = app.audioSettings.master / 100;
  if(audio && audio.bgmBus) audio.bgmBus.gain.value = app.audioSettings.bgm / 100;
  const sfxGain = app.audioSettings.sfx / 100;
  if(audio && audio.sfxBus) audio.sfxBus.gain.value = sfxGain;
  if(audio && audio.uiBus) audio.uiBus.gain.value = sfxGain;
  syncAudioPanelUI();
  saveAudioSettings();
}

function openAudioOverlay(){

class AudioEngine {
  constructor(){
    this.ctx = null;
    this.master = null; this.bgmBus = null; this.sfxBus = null; this.uiBus = null;
    this.buffers = new Map();
    this.bgm = null;
  }
  async init(){
    if(this.ctx) return;
    this.ctx = new (window.AudioContext || window.webkitAudioContext)({latencyHint:'interactive'});
    this.master = this.ctx.createGain(); this.master.gain.value = app.audioSettings.master / 100;
    this.bgmBus = this.ctx.createGain(); this.bgmBus.gain.value = app.audioSettings.bgm / 100;
    this.sfxBus = this.ctx.createGain(); this.sfxBus.gain.value = app.audioSettings.sfx / 100;
    this.uiBus = this.ctx.createGain(); this.uiBus.gain.value = app.audioSettings.sfx / 100;
    this.bgmBus.connect(this.master); this.sfxBus.connect(this.master); this.uiBus.connect(this.master); this.master.connect(this.ctx.destination);
  }
  async resume(){ if(this.ctx && this.ctx.state !== 'running') await this.ctx.resume(); }
  async suspend(){ if(this.ctx && this.ctx.state === 'running') await this.ctx.suspend(); }
  async preload(onProgress){
    await this.init();
    const tracks = LEVELS.filter(l=>l.track).map(l=>l.track);
    let done = 0;
    for(const file of tracks){
      try{
        const res = await fetch(file);
        const ab = await res.arrayBuffer();
        const buffer = await this.ctx.decodeAudioData(ab.slice(0));
        this.buffers.set(file, buffer);
      } catch(err){ console.warn('Track preload failed', file, err); }
      done++;
      onProgress(done / tracks.length);
    }
  }
  stopMusic(){
    if(this.bgm){
      try{ this.bgm.source.stop(); } catch(e){}
      try{ this.bgm.source.disconnect(); } catch(e){}
      try{ this.bgm.filter.disconnect(); } catch(e){}
      try{ this.bgm.gain.disconnect(); } catch(e){}
      try{ this.bgm.panner.disconnect(); } catch(e){}
      this.bgm = null;
    }
  }
  playLevelTrack(trackFile, when, offset=0){
    this.stopMusic();
    if(!trackFile) return null;
    const buffer = this.buffers.get(trackFile);
    if(!buffer) return null;
    const source = this.ctx.createBufferSource();
    source.buffer = buffer; source.loop = true;
    const filter = this.ctx.createBiquadFilter(); filter.type = 'lowpass'; filter.frequency.value = 1400;
    const gain = this.ctx.createGain(); gain.gain.value = .5;
    const panner = this.ctx.createPanner();
    panner.panningModel = 'HRTF'; panner.distanceModel = 'linear'; panner.rolloffFactor = 0;
    panner.refDistance = 1; panner.maxDistance = MAP_RADIUS * 1.5; panner.coneInnerAngle = 360; panner.coneOuterAngle = 360;
    source.connect(filter); filter.connect(gain); gain.connect(panner); panner.connect(this.bgmBus);
    source.start(when, offset);
    this.bgm = {source, filter, gain, panner, file:trackFile, startAt:when-offset};
    return this.bgm;
  }
  updateListener(px,pz,angle){
    if(!this.ctx) return;
    const L = this.ctx.listener;
    const z = -pz * 0.01;
    const x = px * 0.01;
    const fx = Math.cos(angle), fz = -Math.sin(angle);
    if(L.positionX){
      L.positionX.value = x; L.positionY.value = 0; L.positionZ.value = z;
      L.forwardX.value = fx; L.forwardY.value = 0; L.forwardZ.value = fz;
      L.upX.value = 0; L.upY.value = 1; L.upZ.value = 0;
    } else {
      L.setPosition(x,0,z); L.setOrientation(fx,0,fz,0,1,0);
    }
  }
  setMusicTarget(tx,tz, cutoff, gainValue){
    if(!this.bgm) return;
    const x = tx * 0.01, z = -tz * 0.01;
    const p = this.bgm.panner;
    if(p.positionX){ p.positionX.value = x; p.positionY.value = 0; p.positionZ.value = z; }
    else { p.setPosition(x,0,z); }
    this.bgm.filter.frequency.setTargetAtTime(cutoff, this.ctx.currentTime, .04);
    this.bgm.gain.gain.setTargetAtTime(gainValue, this.ctx.currentTime, .05);
  }
  duck(){
    if(!this.ctx) return;
    const t = this.ctx.currentTime;
    const g = this.bgmBus.gain;
    g.cancelScheduledValues(t);
    g.setValueAtTime(g.value, t);
    g.setTargetAtTime(.15, t, .05);
    g.setTargetAtTime(1, t + .2, .15);
  }
  tone(freq=880, dur=.08, bus='ui', type='triangle', vol=.18){
    if(!this.ctx) return;
    const t = this.ctx.currentTime;
    const o = this.ctx.createOscillator(); const g = this.ctx.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t+.005); g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    o.connect(g); g.connect(bus==='ui'?this.uiBus:this.sfxBus); o.start(t); o.stop(t+dur+.02);
  }
  uiPing(ok=true){ this.tone(ok?1080:780, .08, 'ui', ok?'triangle':'sawtooth', ok?.16:.12); }
  collectChime(){ this.tone(1320,.12,'ui','triangle',.2); setTimeout(()=>this.tone(1760,.14,'ui','sine',.14),70); }
  metronome(strong=false){ this.tone(strong?1720:1380,strong?.06:.045,'sfx','square',strong?.18:.1); }
  sonarPulse(opts={}){
    if(!this.ctx) return;
    const {x=0,z=0,freq=420,cutoff=8000,vol=.16,dur=.18,delay=0,type='triangle'} = opts;
    const t = this.ctx.currentTime + delay;
    const o = this.ctx.createOscillator(); const g = this.ctx.createGain(); const f = this.ctx.createBiquadFilter(); const p=this.ctx.createPanner();
    o.type = type; o.frequency.value = freq; f.type='lowpass'; f.frequency.value = cutoff;
    p.panningModel='HRTF'; p.distanceModel='linear'; p.rolloffFactor=0;
    const px = x*0.01, pz=-z*0.01; if(p.positionX){p.positionX.value=px;p.positionY.value=0;p.positionZ.value=pz;} else p.setPosition(px,0,pz);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t+.01); g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    o.connect(f); f.connect(g); g.connect(p); p.connect(this.sfxBus); o.start(t); o.stop(t+dur+.03);
  }
}

function requestFullscreenSafe(){
  const el = document.documentElement;
  const fn = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
  if(fn) try { return fn.call(el); } catch(e){ return Promise.resolve(); }
  return Promise.resolve();
}

async function bootstrap(){
  el.bootBtn.disabled = true;
  app.boot.status = '系統喚醒中'; renderBoot(0);
  await requestFullscreenSafe();
  try {
    await audio.init();
    await audio.resume();
    app.boot.status = '音訊初始化'; renderBoot(.18);
    await wait(220);
    app.boot.status = '資源檢查中'; renderBoot(.28);
    await audio.preload((p)=>{
      app.boot.status = '資源檢查中'; renderBoot(.28 + p*.62);
    });
    app.resourcesReady = true;
    app.boot.status = '準備完成'; renderBoot(1);
    await wait(180);
    setActiveScreen('menu');
    updateMenuPrimary();
  } catch(err){
    console.error(err);
    app.boot.status = '啟動失敗，請再試一次'; renderBoot(.12);
    el.bootBtn.disabled = false; return;
  }
}
function renderBoot(p){ el.bootBar.style.width = `${Math.round(clamp(p,0,1)*100)}%`; el.bootStatus.textContent = app.boot.status; }
function wait(ms){ return new Promise(r=>setTimeout(r,ms)); }

function updateMenuPrimary(){
  if(Number.isInteger(app.lastSuccessfulLevel)){

    el.continueLine.textContent = `上次進度：第 ${app.lastSuccessfulLevel} 關`;
  } else {
    el.continueBtn.textContent = '開始';
    el.continueLine.textContent = '';
  }
}

function levelCardMarkup(level){
  const status = level.playable ? '可進入' : '尚未部署';
  const order = {theme:0, play:1, threat:2};
  const tags = [...level.tags].sort((a,b)=>(order[a.role]??9)-(order[b.role]??9)).map((tag,i)=>`<span class="tag slot-${i+1} role-${tag.role} tone-${tag.tone}">${tag.label}</span>`).join('');
  const detailRows = level.goalLabel || level.threatLabel ? `
      <div class="signal-block">
        ${level.goalLabel ? `<div class="signal-row goal"><span class="signal-name">主目標</span><span class="signal-value">${level.goalLabel}</span></div>` : ''}
        ${level.threatLabel ? `<div class="signal-row threat"><span class="signal-name">干擾威脅</span><span class="signal-value">${level.threatLabel}</span></div>` : ''}
      </div>` : '';
  return `<article class="level-card ${level.playable?'':'locked'}" data-level="${level.idx}">
    <div class="card-top">
      <div class="card-kicker">第 ${level.idx} 關</div>
      <div class="card-title">${level.subtitle}</div>
      <div class="card-bpm">${level.bpm} BPM</div>
    </div>
    <div class="card-body">
      <div class="tag-row">${tags}</div>
      <div class="card-desc">${level.desc}</div>
      <div class="card-detail"><div class="card-detail-inner"><div class="card-detail-panel"><div class="card-detail-label">關卡重點</div><div class="card-detail-text">${level.objective}</div>${detailRows}</div></div></div>
    </div>
    <div class="card-bottom">
      <div class="card-status ${level.playable?'ready':'locked'}">${status}</div>
    </div>
  </article>`;
}

function bindInteractiveSurfaces(root=document){
  const nodes = root.querySelectorAll('.level-card, button, .tag');
  nodes.forEach(node=>{
    if(node.dataset.fxBound==='1') return;
    node.dataset.fxBound='1';
    const mode = node.classList.contains('level-card') ? 'card' : node.classList.contains('tag') ? 'tag' : 'button';
    node.addEventListener('pointerenter', ()=>{ node.classList.add('hovered'); setPointerMode(mode); setPointerHot(true); });
    node.addEventListener('pointerleave', ()=>{ node.classList.remove('hovered'); node.style.removeProperty('--mx'); node.style.removeProperty('--my'); node.style.removeProperty('--scanX'); node.style.removeProperty('--px'); node.style.removeProperty('--py'); setPointerMode('default'); setPointerHot(false); });
    node.addEventListener('pointermove', (e)=>{
      const r = node.getBoundingClientRect();
      const x = e.clientX - r.left;
      const y = e.clientY - r.top;
      node.style.setProperty('--px', `${x}px`);
      node.style.setProperty('--py', `${y}px`);
      if(node.classList.contains('level-card')){
        node.style.setProperty('--mx', `${x}px`);
        node.style.setProperty('--my', `${y}px`);
        node.style.setProperty('--scanX', `${x}px`);
      }
    });
  });
}

function setSelectedLevel(index, instant=false){
  const previous = app.selectedLevel;
  app.selectedLevel = clamp(index, 0, LEVELS.length-1);
  const cards = [...el.levelsList.querySelectorAll('.level-card')];
  cards.forEach((card,i)=>{
    const delta = i - app.selectedLevel;
    card.classList.toggle('is-active', delta===0);
    card.classList.toggle('is-near', Math.abs(delta)===1);
  });
  const level = LEVELS[app.selectedLevel];
  el.footerSummary.textContent = level.footer;
  el.startSelectedBtn.textContent = `開始第 ${level.idx} 關`; 
  el.startSelectedBtn.disabled = !level.playable;
  const active = el.levelsList.querySelector('.level-card.is-active');
  if(active && previous !== app.selectedLevel){
    active.classList.remove('trail');
    void active.offsetWidth;
    active.classList.add('trail');
    clearTimeout(active._trailTimer);
    active._trailTimer = setTimeout(()=>active.classList.remove('trail'), 240);
  }
  if(instant && active){
    active.scrollIntoView({behavior:'auto', inline:'center', block:'nearest'});
  }
}

function wireCarousel(){
  const wrap = el.levelsList;
  let isDown=false, startX=0, scrollStart=0, vx=0, lastX=0, lastT=0, raf=0;
  const getCards = ()=>[...wrap.querySelectorAll('.level-card')];
  const updateFocus = ()=>{
    const mid = wrap.scrollLeft + wrap.clientWidth/2;
    let best = 0, bestDist = Infinity;
    getCards().forEach((card, i)=>{
      const center = card.offsetLeft + card.offsetWidth/2;
      const d = Math.abs(center - mid);
      if(d < bestDist){ bestDist = d; best = i; }
    });
    setSelectedLevel(best);
  };
  const snapToActive = ()=>{
    const active = wrap.querySelector('.level-card.is-active');
    if(active) active.scrollIntoView({behavior:'smooth', inline:'center', block:'nearest'});
  };
  const momentum = ()=>{
    if(Math.abs(vx) < .3){ wrap.classList.remove('dragging'); snapToActive(); return; }
    wrap.scrollLeft -= vx;
    vx *= .92;
    updateFocus();
    raf = requestAnimationFrame(momentum);
  };
  const stopMomentum = ()=>{ if(raf) cancelAnimationFrame(raf); raf = 0; };
  wrap.addEventListener('mousedown', (e)=>{ if(e.target.closest('button')) return; isDown=true; stopMomentum(); wrap.classList.add('dragging'); setPointerMode('drag'); setPointerHot(true); startX=e.clientX; lastX=e.clientX; lastT=performance.now(); scrollStart=wrap.scrollLeft; vx=0; e.preventDefault(); });
  window.addEventListener('mousemove', (e)=>{ if(!isDown) return; const dx=e.clientX-startX; wrap.scrollLeft=scrollStart-dx; const now=performance.now(); const dt=Math.max(1, now-lastT); vx=(e.clientX-lastX)/dt*18; lastX=e.clientX; lastT=now; updateFocus(); });
  const endDrag = ()=>{ if(!isDown) return; isDown=false; setPointerMode('default'); setPointerHot(false); momentum(); };
  window.addEventListener('mouseup', endDrag); window.addEventListener('mouseleave', endDrag); wrap.addEventListener('scroll', ()=>{ if(!isDown && !raf) updateFocus(); }, {passive:true});
  wrap.addEventListener('click', (e)=>{ const card=e.target.closest('.level-card'); if(!card) return; const idx=Number(card.dataset.level); setSelectedLevel(idx); snapToActive(); });
}

function updateCalibrationView(){ el.calOffset.textContent = fmtMs(app.audioLatencyOffset); }
function calibrationFeedback(label, color='var(--muted)'){
  el.calFeedback.textContent = label; el.calFeedback.style.color = color; app.calibration.feedbackUntil = performance.now() + 260;
}
function resetCalibrationLoop(){
  app.calibration.auto = false; app.calibration.samples = []; calibrationFeedback('', 'var(--muted)');
}
function startCalibrationLoop(){ audio.resume(); if(audio._calTimer) clearInterval(audio._calTimer); audio._calBeat=0; audio._calStart=audio.ctx.currentTime+.08; audio._calTimer = setInterval(()=>{
    audio.metronome(audio._calBeat%4===0); audio._calBeat++;
  }, 500); }
function stopCalibrationLoop(){ if(audio._calTimer) clearInterval(audio._calTimer); audio._calTimer=null; }
function startAutoMeasure(){ app.calibration.auto=true; app.calibration.samples=[]; calibrationFeedback('AUTO','var(--accent)'); app.calibration.autoUntil = performance.now() + 5000; }
function handleCalibrationTap(){
  if(!audio.ctx) return;
  const beatDur = .5;
  const t = audio.ctx.currentTime;
  const base = audio._calStart || t;
  const beatFloat = (t - base) / beatDur;
  const nearest = Math.round(beatFloat);
  const target = base + nearest * beatDur;
  const delta = t - target + app.audioLatencyOffset;
  const ms = Math.round(delta*1000);
  const abs = Math.abs(ms);
  if(ms<0) calibrationFeedback(`EARLY ${ms} ms`, abs<=20?'#9feeff':'#ffc48d');
  else calibrationFeedback(`LATE +${ms} ms`, abs<=20?'#9feeff':'#ffc48d');
  if(app.calibration.auto){
    app.calibration.samples.push(delta);
    if(app.calibration.samples.length>=8){
      const avg = app.calibration.samples.reduce((a,b)=>a+b,0)/app.calibration.samples.length;
      app.audioLatencyOffset = clamp(-avg, -.3, .3); updateCalibrationView(); resetCalibrationLoop(); calibrationFeedback('AUTO COMPLETE', 'var(--accent2)');
    }
  }
}

function enterCalibration(){
  setActiveScreen('calibration'); updateCalibrationView(); startCalibrationLoop(); resetCalibrationLoop();
}
function leaveCalibration(){ stopCalibrationLoop(); setActiveScreen('menu'); updateMenuPrimary(); }

function currentWorldTime(ps){
  if(audio.ctx && ps.startedAt) return Math.max(0, audio.ctx.currentTime - ps.startedAt);

}
function adjustedTime(ps){ return currentWorldTime(ps) - app.audioLatencyOffset - ps.songOffset; }

function pulseLevelAudio(ps){
  const beat = Math.floor(adjustedTime(ps) / beatDur(ps));
  if(beat === ps.pulseBeat) return;
  ps.pulseBeat = beat;

  if(ps.idx===0){ audio.metronome(strong); if(ps.phase==='listen' && beat >= ps.listenBeats){ ps.phase='practice'; ps.statusText='開始跟拍'; updatePlayHUD(); } return; }
  const d = dist(ps.player.x, ps.player.z, ps.target.x, ps.target.z);
  const prox = 1 - clamp(d / (MAP_RADIUS * 1.2), 0, 1);

  audio.sonarPulse({x:ps.target.x,z:ps.target.z,freq:strong?440:360,cutoff,vol:lerp(.08,.16,prox),dur:.16});

  }

    audio.sonarPulse({x:ps.decoy.x,z:ps.decoy.z,freq:390+Math.sin(adjustedTime(ps)*4)*30,cutoff:3400,vol:.09,dur:.1,delay:.07});
  }
  if(ps.level.kind==='pressure' || ps.level.kind==='highpressure' || ps.level.kind==='final'){
    if(ps.sync < .45) audio.sonarPulse({x:ps.player.x + Math.cos(ps.player.angle)*80, z:ps.player.z + Math.sin(ps.player.angle)*80, freq:170, cutoff:900, vol:.09, dur:.2, type:'square'});
  }
  if(ps.level.kind==='memory'){
    ps.memoryOpen = !ps.memoryOpen;
    ps.memoryToggleAt = performance.now();
  }
  if(ps.level.kind==='misalign'){
    // no extra pulse; distortion handled in audio target update
  }
}

function updateLevelSystems(ps, dt){
  const d = dist(ps.player.x, ps.player.z, ps.target.x, ps.target.z);
  let prox = 1 - clamp(d / (MAP_RADIUS * 1.2), 0, 1);
  let cutoff = lerp(600, 18000, Math.pow(prox, .7));
  let gain = lerp(.35, 1.0, Math.pow(prox, .7));
  let targetX = ps.target.x, targetZ = ps.target.z;
  const now = performance.now();

  if(ps.level.kind==='memory'){
    const cycle = currentWorldTime(ps) % 4.8;
    ps.memoryOpen = cycle < 2.6;
    if(!ps.memoryOpen){ cutoff = 900; gain *= .18; ps.statusText='聲音消失，靠記憶前進'; }
    else { ps.statusText='記住剛才的方向'; }
  }
  if(ps.level.kind==='silence'){
    const cycle = currentWorldTime(ps) % 5.2;
    const bloom = cycle > 2.7;
    cutoff = bloom ? lerp(350, 7600, Math.pow(prox, .62)) : lerp(700, 13200, Math.pow(prox, .68));
    gain = bloom ? lerp(.18,.82,Math.pow(prox,.72)) : lerp(.3,.95,Math.pow(prox,.75));
    ps.statusText = bloom ? '靜默花正在吞掉高頻' : '聽不到，不代表安全';
  }
  if(ps.level.kind==='pressure'){
    ps.sync -= dt * .04;
    ps.statusText = ps.sync<.45 ? '節拍蛭正在侵蝕' : '穩住拍子';
  }
  if(ps.level.kind==='highpressure'){
    ps.sync -= dt * .062;
    ps.statusText = ps.sync<.45 ? '高壓侵蝕加劇' : '高壓穩拍';
  }
  if(ps.level.kind==='misalign'){
    const wob = Math.sin(currentWorldTime(ps)*.9) * 180;
    targetX += Math.cos(currentWorldTime(ps)*.7) * wob;
    targetZ += Math.sin(currentWorldTime(ps)*.8) * wob;
    cutoff = lerp(700, 15000, Math.pow(prox,.65));
    ps.statusText='世界正在偏斜';
  }
  if(ps.level.kind==='mimic'){
    ps.statusText='熟悉，不代表可信';
  }
  if(ps.level.kind==='double'){
    ps.statusText='比較兩個近似來源';
  }
  if(ps.level.kind==='echo'){
    ps.statusText='主目標穩定，假回聲延遲';
  }
  if(ps.level.kind==='final'){
    ps.sync -= dt * .036;
    const wob = Math.sin(currentWorldTime(ps)*.6) * 120;
    targetX += wob; targetZ += Math.cos(currentWorldTime(ps)*.9)*wob;
    cutoff = lerp(650, 17500, Math.pow(prox,.7));
    ps.statusText = ps.sync<.45 ? '最終壓力逼近' : '整合所有規則';
  }

  ps.sync = clamp(ps.sync, 0, 1);
  if(ps.sync <= 0 && ps.idx!==0){ ps.failReason = '同步崩潰'; return finishLevel(false); }

  if(ps.idx===0){
    if(ps.phase==='listen') ps.statusText='先聽 16 拍';
    if(ps.phase==='practice') ps.statusText=`穩住節拍 ${ps.goodCount} / ${ps.practiceNeeded}`;
    if(ps.phase==='recover') ps.statusText='先穩住拍子';
    if(ps.phase==='move') ps.statusText=`教學進度 ${ps.collected} / ${ps.collectGoal}`;
    cutoff = 18000; gain = 0;
  }

  audio.updateListener(ps.player.x, ps.player.z, ps.player.angle);
  if(ps.level.track) audio.setMusicTarget(targetX, targetZ, cutoff, gain);

  if(ps.decoy && ps.decoy.active){
    if(ps.level.kind==='echo'){
      const t = currentWorldTime(ps)*.14 + ps.idx;
      const ex = ps.target.x + Math.cos(t)*420;
      const ez = ps.target.z + Math.sin(t*1.13)*260;
      Object.assign(ps.decoy, constrainToCircle(ex,ez));
    }
    if(ps.level.kind==='mimic'){
      const t = currentWorldTime(ps)*.9;
      Object.assign(ps.decoy, constrainToCircle(ps.target.x + Math.cos(t)*340, ps.target.z + Math.sin(t*1.2)*280));
    }
    if(ps.level.kind==='double' || ps.level.kind==='final'){
      const t = currentWorldTime(ps)*.3;
      Object.assign(ps.decoy, constrainToCircle(ps.target.x + Math.cos(t)*560, ps.target.z - Math.sin(t)*460));
    }
    const dd = dist(ps.player.x, ps.player.z, ps.decoy.x, ps.decoy.z);
    if(dd <= ps.target.r*0.9 && now > ps.decoyCooldownUntil && ps.idx!==0){
      ps.decoyCooldownUntil = now + 900;
      ps.sync = clamp(ps.sync - (ps.level.kind==='final' ? .18 : .12), 0, 1);
      audio.duck();
      showJudge('FALSE', '#ff9aba', false);
      if(ps.level.kind==='echo') ps.statusText='被假回聲誤導';
      if(ps.level.kind==='double') ps.statusText='你追到了錯的來源';
      if(ps.level.kind==='mimic') ps.statusText='那不是你該相信的聲音';
      if(ps.level.kind==='final') ps.statusText='核心騙局咬住了你';
      if(ps.level.kind==='echo' || ps.level.kind==='double' || ps.level.kind==='mimic' || ps.level.kind==='final'){
        ps.decoy = {...pickRandomTargetFar(ps.player), active:true};
      }
      updatePlayHUD();
    }
  }

  if(ps.idx===0 && ps.phase!=='move') return;
  const hit = d <= ps.target.r;
  if(hit){
    ps.collected++;
    audio.collectChime();
    if(ps.collected >= ps.collectGoal){ return finishLevel(true); }
    if(ps.idx===0){
      ps.target = {x:700 + ps.collected*500, z:0, r:180};
      ps.statusText=`教學進度 ${ps.collected} / ${ps.collectGoal}`;
    } else {
      ps.target = {...pickRandomTargetFar(ps.player), r: ps.target.r};
      if(ps.level.kind==='echo' || ps.level.kind==='double' || ps.level.kind==='mimic' || ps.level.kind==='final'){
        ps.decoy = {...pickRandomTargetFar(ps.player), active:true};
      }
    }
  }
}

function judgeTap(){
  const ps = app.play; if(!ps) return;
  const time = adjustedTime(ps); const bd = beatDur(ps);

  const delta = time - targetTime;
  const abs = Math.abs(delta);
  let result = 'MISS';
  if(abs <= .08) result='PERFECT'; else if(abs <= .16) result='GOOD';
  if(result==='MISS'){
    ps.sync = clamp(ps.sync - .14, 0, 1); ps.continuousMiss++; audio.duck(); showJudge('MISS','#ff7b94', false);
    if(ps.idx===0){
      if(ps.continuousMiss >= 3 || ps.sync<=0){ ps.phase='recover'; ps.recoveredHits=0; ps.statusText='先穩住拍子'; }
    }
    updatePlayHUD(); return;
  }
  ps.continuousMiss = 0;
  ps.sync = clamp(ps.sync + (result==='PERFECT'?.08:.05), 0, 1);
  showJudge(result, result==='PERFECT' ? '#9feeff' : '#8fffc1', true);

}

function tryStep(ps){
  const step = ps.idx===0 ? 180 : 150;

  const nz = ps.player.z + Math.sin(ps.player.angle) * step;
  const p = constrainToCircle(nx, nz);
  ps.player.x = p.x; ps.player.z = p.z;
}

  if(app.state==='calibration' && app.calibration.auto && performance.now() > app.calibration.autoUntil && app.calibration.samples.length < 8){ resetCalibrationLoop(); calibrationFeedback('樣本不足', '#ffc48d'); }
}

// events
el.bootBtn.addEventListener('click', bootstrap);
el.continueBtn.addEventListener('click', ()=>{ if(Number.isInteger(app.lastSuccessfulLevel)) startLevel(app.lastSuccessfulLevel); else enterLevelSelect(); });
el.toSelectBtn.addEventListener('click', enterLevelSelect);
el.toCalibrationBtn.addEventListener('click', enterCalibration);
el.selectBackBtn.addEventListener('click', ()=> setActiveScreen('menu'));
el.startSelectedBtn.addEventListener('click', ()=>{ if(!LEVELS[app.selectedLevel].playable) return; startLevel(app.selectedLevel); });
el.calBackBtn.addEventListener('click', leaveCalibration);
el.calDoneBtn.addEventListener('click', leaveCalibration);
el.calMinus10.addEventListener('click', ()=>{ app.audioLatencyOffset = clamp(app.audioLatencyOffset - .01, -.3, .3); updateCalibrationView(); });
el.calMinus1.addEventListener('click', ()=>{ app.audioLatencyOffset = clamp(app.audioLatencyOffset - .001, -.3, .3); updateCalibrationView(); });
el.calPlus1.addEventListener('click', ()=>{ app.audioLatencyOffset = clamp(app.audioLatencyOffset + .001, -.3, .3); updateCalibrationView(); });
el.calPlus10.addEventListener('click', ()=>{ app.audioLatencyOffset = clamp(app.audioLatencyOffset + .01, -.3, .3); updateCalibrationView(); });
el.autoMeasureBtn.addEventListener('click', startAutoMeasure);
el.pauseResumeBtn.addEventListener('click', resumePlay);
el.pauseRestartBtn.addEventListener('click', ()=>{ const idx = app.play?.idx; if(idx==null) return; startLevel(idx); });
el.pauseMenuBtn.addEventListener('click', abortPlayToMenu);

el.openAudioBtn.addEventListener('click', openAudioOverlay);
el.pauseAudioBtn.addEventListener('click', openAudioOverlay);
el.audioCloseBtn.addEventListener('click', closeAudioOverlay);
el.audioResetBtn.addEventListener('click', ()=>{ app.audioSettings.master = 100; app.audioSettings.bgm = 100; app.audioSettings.sfx = 100; applyAudioSettings(); });
el.masterSlider.addEventListener('input', (e)=> setAudioSetting('master', e.target.value));
el.bgmSlider.addEventListener('input', (e)=> setAudioSetting('bgm', e.target.value));
el.sfxSlider.addEventListener('input', (e)=> setAudioSetting('sfx', e.target.value));
el.audioOverlay.addEventListener('click', (e)=>{ if(e.target===el.audioOverlay) closeAudioOverlay(); });

el.resultMenuBtn.addEventListener('click', leaveResultToMenu);
el.resultRetryBtn.addEventListener('click', retryCurrentLevel);
el.resultPrimaryBtn.addEventListener('click', resultAdvance);

document.addEventListener('keydown', (e)=>{
  if(app.state==='calibration'){
    if(e.code==='Space'){ e.preventDefault(); handleCalibrationTap(); }
    if(e.key==='['){ app.audioLatencyOffset = clamp(app.audioLatencyOffset - .001, -.3, .3); updateCalibrationView(); }
    if(e.key===']'){ app.audioLatencyOffset = clamp(app.audioLatencyOffset + .001, -.3, .3); updateCalibrationView(); }
  }
  if(app.state==='play'){
    if(e.code==='Space'){ e.preventDefault(); judgeTap(); }
    if(e.key==='`'){ app.debugMap = !app.debugMap; }
    if(e.key==='Escape'){ e.preventDefault(); pausePlay('已中斷目前關卡。'); }
  }
  if(app.state==='result'){
    if(e.key==='Escape'){ leaveResultToMenu(); }
    if(e.code==='Enter'){ resultAdvance(); }
  }
});

document.addEventListener('mousemove', (e)=>{
  const ps = app.play; if(!ps || app.state!=='play') return;
  if(ps.idx===0) return;
  if(document.pointerLockElement !== el.playCanvas && document.pointerLockElement !== document.body) return;
  ps.player.angle += e.movementX * 0.0026;
});
el.playCanvas.addEventListener('click', ()=>{ if(app.state==='play') try{ el.playCanvas.requestPointerLock?.(); } catch(err){} });
window.addEventListener('resize', ()=>{ drawPlay(); drawRadar(); });
window.addEventListener('blur', ()=>{ if(app.state==='play') pausePlay('已偵測到切離畫面，已自動中斷。'); });
document.addEventListener('visibilitychange', ()=>{ if(document.hidden && app.state==='play') pausePlay('已偵測到切離畫面，已自動中斷。'); });
document.addEventListener('pointerlockchange', ()=>{ if(app.state==='play' && app.play && !app.play.paused && document.pointerLockElement !== el.playCanvas){ pausePlay('已失去操控焦點，已自動中斷。'); } });

// init boot button ready immediately; actual load on click
renderBoot(0); el.bootBtn.disabled = false; buildLevelSelect(); bindInteractiveSurfaces(document); updateCalibrationView(); updateMenuPrimary(); loop();
})();
</script>

<script>
/* v43 cursor hotfix: direct pointer following */
(function(){
  function bootCursorHotfix(){
    const cp = document.getElementById('cursorPresence');
    if(!cp) return;
    const ring = cp.querySelector('.cursor-ring');
    const core = cp.querySelector('.cursor-core');
    const tail = cp.querySelector('.cursor-tail');
    if(!ring || !core || !tail) return;
    if (window.matchMedia && window.matchMedia('(pointer: coarse)').matches) return;

    document.body.classList.add('cursor-ready','cursor-active','cursor-enhanced','cursor-hidden');
    cp.classList.add('visible');
    cp.dataset.mode = cp.dataset.mode || 'default';

    let lastX = window.innerWidth * 0.5;
    let lastY = window.innerHeight * 0.5;
    let x = lastX;
    let y = lastY;

    function paint(nx, ny){
      x = nx; y = ny;
      const dx = x - lastX;
      const dy = y - lastY;
      const angle = Math.atan2(dy || 0.001, dx || 0.001) * 180 / Math.PI;
      const dist = Math.max(18, Math.min(54, Math.hypot(dx, dy) * 0.8 + 18));

      ring.style.left = x + 'px';
      ring.style.top = y + 'px';
      core.style.left = x + 'px';
      core.style.top = y + 'px';
      tail.style.left = ((lastX + x) * 0.5) + 'px';
      tail.style.top = ((lastY + y) * 0.5) + 'px';
      tail.style.width = dist + 'px';
      tail.style.transform = 'translate(-50%,-50%) rotate(' + angle + 'deg)';
      tail.style.opacity = '0.72';

      lastX = x;
      lastY = y;
    }

    paint(x, y);

    const sync = (e) => {
      if(!e || typeof e.clientX !== 'number' || typeof e.clientY !== 'number') return;
      cp.classList.add('visible');
      document.body.classList.add('cursor-hidden');
      paint(e.clientX, e.clientY);
    };

    window.addEventListener('pointermove', sync, {passive:true, capture:true});
    window.addEventListener('mousemove', sync, {passive:true, capture:true});
    document.addEventListener('pointermove', sync, {passive:true, capture:true});
    document.addEventListener('mousemove', sync, {passive:true, capture:true});
    document.addEventListener('pointerdown', sync, {passive:true, capture:true});
    window.addEventListener('focus', ()=> cp.classList.add('visible'));
    document.addEventListener('visibilitychange', ()=> { if(!document.hidden) cp.classList.add('visible'); });
    window.addEventListener('mouseout', (e)=>{ if(!e.relatedTarget) cp.classList.remove('visible'); });
    window.addEventListener('mouseover', ()=> cp.classList.add('visible'));
    window.addEventListener('resize', ()=> paint(Math.min(x, window.innerWidth-2), Math.min(y, window.innerHeight-2)));
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', bootCursorHotfix, {once:true});
  } else {
    bootCursorHotfix();
  }
})();
</script>
